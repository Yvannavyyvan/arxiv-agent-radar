name: Run arXiv Agent Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute arXiv Radar
        run: python3 ./arxiv_agent_radar.py "autonomous agent" "multi-agent" "memory"

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add arxiv_radar_latest.md || true
          git commit -m "chore: update arXiv radar report [skip ci]" || exit 0
          git push
