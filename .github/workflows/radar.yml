name: Run arXiv Agent Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and Execute arXiv Radar
        run: |
          echo "=== Files in repository ==="
          ls -la
          PY_FILE=$(find . -name "*arxiv*.py" -o -name "*.py" | head -n 1)
          echo "Found Python script: $PY_FILE"
          if [ -z "$PY_FILE" ]; then
            echo "ERROR: No python file found in repo!"
            exit 1
          fi
          python3 "$PY_FILE" "autonomous agent" "multi-agent" "memory"

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add arxiv_radar_latest.md || true
          git commit -m "chore: update arXiv radar report [skip ci]" || exit 0
          git push
